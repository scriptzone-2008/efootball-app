<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Outer gold ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="30%" stop-color="#fbc02d"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <!-- Inner face gradient -->
    <radialGradient id="faceGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>
  <!-- Outer rim -->
  <circle cx="16" cy="16" r="15" fill="url(#ringGrad)"/>
  <!-- Inner circular groove -->
  <circle cx="16" cy="16" r="12.5" fill="url(#faceGrad)"/>
  <!-- Thin inner bevel line -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#fef9c3" stroke-width="0.75" opacity="0.9"/>
  <!-- eFootball Emblem: Top Arc -->
  <path d="M 10 13 A 6 6 0 0 1 22 13" fill="none" stroke="#78350f" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Middle horizontal bar -->
  <path d="M 9.5 16 L 22.5 16" fill="none" stroke="#78350f" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Bottom Arc -->
  <path d="M 22 19 A 6 6 0 0 1 10 19" fill="none" stroke="#78350f" stroke-width="2.6" stroke-linecap="round"/>
</svg>
