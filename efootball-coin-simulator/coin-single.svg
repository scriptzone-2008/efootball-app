<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <radialGradient id="goldFace" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="35%" stop-color="#fbc02d"/>
      <stop offset="70%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="40%" stop-color="#fbc02d"/>
      <stop offset="80%" stop-color="#c47d04"/>
      <stop offset="100%" stop-color="#7e4c00"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Rim -->
  <circle cx="16" cy="16" r="14.5" fill="url(#goldRim)" filter="url(#dropShadow)"/>
  <!-- Inner Face -->
  <circle cx="16" cy="16" r="12" fill="url(#goldFace)"/>
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#ffe082" stroke-width="0.8" opacity="0.8"/>
  <!-- eFootball Emblem on Coin -->
  <!-- Top Arc -->
  <path d="M 10 13.5 A 6.5 6.5 0 0 1 22 13.5" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Middle bar -->
  <path d="M 9.5 16 L 22.5 16" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom Arc -->
  <path d="M 22 18.5 A 6.5 6.5 0 0 1 10 18.5" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
</svg>
